name: SmartSVG - Verify Authentic V21.15.2 Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-imported-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check archive SHA, all manifests and exact extracted tree
        shell: bash
        run: |
          set -euo pipefail
          echo '9369656f0216cebb6dccce0d0155bffa16d8c384da6a984bf848cdd8aa003c54  source-releases/ComfyUI_SmartSVG_Studio_V21_15_2_Installation.zip' | sha256sum --check
          echo '0e503a55fa622d7acea44d8e742205fb6a71119262c309a0b5a2bd48f0ab28a3  docs/ROADMAP_MASTER_v3_2.md' | sha256sum --check
          python tools/verify_source_integrity.py --repo .
          python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Verify admission evidence exists (no state changes)
        shell: bash
        run: |
          test -s docs/IMPORT_V21_15_2.json
          test -s .automation/READY
          echo 'G0 source is admitted for draft-PR development. No GPU/Cricut claim is implied.'
