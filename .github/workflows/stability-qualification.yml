name: SmartSVG - Stability qualification (Windows, Node, browser)

# Owner-authorized manual validation micro-lot; complements (never replaces) G0.
# A CI pass here does not certify native Windows UI, ComfyUI, GPU or Cricut.
on:
  pull_request:
    paths:
      - "engine/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/stability-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-dom:
    name: Node 22 DOM contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every existing Node test (including G3.3 interactions)
        shell: bash
        run: |
          set -euo pipefail
          for script in tests/*.mjs; do
            echo "NODE TEST: $script"
            node "$script"
          done
          for script in tools/test_*.mjs; do
            if [[ -f "$script" ]]; then
              echo "NODE TEST: $script"
              node "$script"
            fi
          done

  windows-python:
    name: Windows Python 3.11 full regression (no skip of known failures)
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record platform diagnosis
        shell: pwsh
        run: |
          python --version
          git --version
          bash --version
          where.exe bash
          $jq = Get-Command jq -ErrorAction SilentlyContinue
          if ($jq) { jq --version } else { Write-Host "jq unavailable" }
      # Existing Linux CPU smoke covers engine behavior but cannot exercise
      # the real Tk event loop on Windows. These are TEST-ONLY dependencies,
      # already required by the G3.3e brush; not product requirements or IA.
      - name: Install native brush CPU test dependencies on Windows
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: "numpy==2.4.6" "Pillow==13.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'import numpy, PIL; print("Windows native brush test runtime:", numpy.__version__, PIL.__version__)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full Python suite on native Windows (with brush CPU dependencies)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # A generic unittest SUCCESS allows SKIP. This targeted runner instead
      # proves precisely one complete managed-V1 -> Tk -> real-CPU brush case
      # with zero skips, once the native Atelier PR supplies that test.
      - name: Strict native V1 to Tk to CPU regression (no skips)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if (-not (Test-Path "tests/test_v34_native_subject_preview.py")) {
            Write-Host "NON_EXECUTE: native Atelier integration test absent on this HEAD."
          } else {
            python -c 'import sys, unittest; sys.path[:0]=["engine","tests"]; suite=unittest.defaultTestLoader.loadTestsFromName("test_v34_native_subject_preview.NativeSubjectPreviewTests.test_real_v1_tk_brush_gesture_uses_cpu_without_persisting"); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.testsRun==1 and result.wasSuccessful() and not result.skipped else 1)'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  chromium-layout:
    name: Chromium responsive layout and navigation (demo only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright for CI
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Serve synthetic demo on localhost only
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory engine/web/js >/tmp/smartsvg-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/smartsvg_express_atelier_preview.html -o /dev/null; then
              echo "Local demo server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/smartsvg-http.log
          exit 1
      - name: Browser stability five viewports, keyboard and navigation
        run: node tests/stability_atelier_browser.cjs
      - name: Preserve synthetic browser proof, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-browser-synthetic
          path: stability-artifacts/
          if-no-files-found: warn
          retention-days: 7
