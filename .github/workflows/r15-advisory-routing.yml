name: SmartSVG R15 - Advisory routing

# Owner-reviewed candidate. Schedule becomes effective only on default main.
# Read-only output is optional advice, not a required PR or merger gate.
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/r15-advisory-routing.yml"
      - "tools/smartsvg_controller_*.py"
      - "tests/test_r15_controller_runtime.py"

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: r15-advisory-routing-${{ github.event_name == 'pull_request' && 'pilot' || 'main' }}
  cancel-in-progress: false

jobs:
  route-live:
    if: ${{ github.repository == 'frenndak/SmartSVG-Studio' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 196 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'owner/r15-controller-shadow-20261125')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Publish reduced live routing advice
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          R15_REQUIRE_MAIN: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          SMARTSVG_GITHUB_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m tools.smartsvg_controller_runtime
