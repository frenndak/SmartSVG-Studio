name: SmartSVG - Read Only Integration Preflight

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number to inspect; this workflow never merges"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read

concurrency:
  group: smartsvg-integration-preflight
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read trusted main only, never candidate code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Fetch current PR, current main, exact-head CI and review
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          repo="frenndak/SmartSVG-Studio"
          gh api "repos/$repo/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          head_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ && "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$repo/compare/main...$head_sha" > "$RUNNER_TEMP/compare.json"
          # GitHub compares can omit details for large diffs. Paginate the
          # authoritative PR files endpoint and verify exact count fail-closed.
          gh api --paginate "repos/$repo/pulls/$PR_NUMBER/files?per_page=100" |
            jq -s 'add' > "$RUNNER_TEMP/files.json"
          expected_files="$(jq -r '.changed_files' "$RUNNER_TEMP/pr.json")"
          actual_files="$(jq 'length' "$RUNNER_TEMP/files.json")"
          test "$expected_files" -gt 0
          test "$expected_files" -eq "$actual_files"
          test "$actual_files" -le 3000
          gh api "repos/$repo/actions/runs?head_sha=$head_sha&per_page=100" > "$RUNNER_TEMP/runs.json"
          # A candidate may edit its own workflow into a no-op success.
          # Compare required workflow blobs against trusted main before
          # accepting any candidate-branch workflow_dispatch evidence.
          : > "$RUNNER_TEMP/workflow_provenance.jsonl"
          while IFS='|' read -r workflow_name workflow_file; do
            path=".github/workflows/$workflow_file"
            main_blob="$(gh api "repos/$repo/contents/$path?ref=$main_sha" --jq .sha)"
            head_blob="$(gh api "repos/$repo/contents/$path?ref=$head_sha" --jq .sha)"
            workflow_id="$(gh api "repos/$repo/actions/workflows/$workflow_file" --jq .id)"
            [[ "$main_blob" =~ ^[0-9a-f]{40}$ && "$head_blob" =~ ^[0-9a-f]{40}$ ]]
            [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
            jq -nc --arg name "$workflow_name" --arg path "$path" --arg main "$main_blob" --arg head "$head_blob" --argjson id "$workflow_id" '{name:$name,path:$path,main_blob_sha:$main,head_blob_sha:$head,workflow_id:$id}' >> "$RUNNER_TEMP/workflow_provenance.jsonl"
          done <<'WORKFLOWS'
          SmartSVG G0 - Admission Tests|g0-admission-tests.yml
          SmartSVG - Live Engine CPU Smoke|engine-cpu-smoke.yml
          WORKFLOWS
          test "$(jq -r '.total_count' "$RUNNER_TEMP/runs.json")" -le 100
          # Resolve decisive reviewers individually with read-only GitHub
          # permission lookups; do not enumerate all repository collaborators.
          # An outsider's verified 404 is ignored only after an owner/admin
          # permission probe succeeds; 403, 5xx and ambiguous errors block.
          gh api --paginate "repos/$repo/pulls/$PR_NUMBER/reviews?per_page=100" |
            jq -s 'add' > "$RUNNER_TEMP/reviews.json"
          gh api --paginate "repos/$repo/issues/29/comments?per_page=100" |
            jq -s 'add' > "$RUNNER_TEMP/audit.json"
          gh api "repos/$repo/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr_checked.json"
          checked_head="$(jq -r '.head.sha' "$RUNNER_TEMP/pr_checked.json")"
          checked_base_ref="$(jq -r '.base.ref' "$RUNNER_TEMP/pr_checked.json")"
          checked_base_sha="$(jq -r '.base.sha' "$RUNNER_TEMP/pr_checked.json")"
          checked_main="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          export PR_NUMBER="$PR_NUMBER" MAIN_SHA="$main_sha" CHECKED_HEAD="$checked_head" CHECKED_MAIN="$checked_main"
          export CHECKED_BASE_REF="$checked_base_ref" CHECKED_BASE_SHA="$checked_base_sha"
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from pathlib import Path
          from tools.integration_eligibility import ReviewerNotCollaborator, resolve_trusted_reviewers
          root=Path(os.environ["RUNNER_TEMP"])
          def read(name): return json.loads((root / name).read_text())
          def reviewer_permission(login):
              # Never log the token or API response body. A 404 only becomes
              # an outsider after resolve_trusted_reviewers confirms owner/admin
              # access with this same token; all other errors fail closed.
              token = os.environ.get("GH_TOKEN")
              if not token:
                  raise ValueError("GITHUB_TOKEN_MISSING")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/frenndak/SmartSVG-Studio/collaborators/{login}/permission",
                  headers={"Accept": "application/vnd.github+json",
                           "Authorization": f"Bearer {token}",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status != 200:
                          raise ValueError("REVIEWER_PERMISSION_HTTP_STATUS_INVALID")
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      raise ReviewerNotCollaborator() from None
                  raise
          try:
              trusted_reviewers = resolve_trusted_reviewers(read("reviews.json"), reviewer_permission)
          except (ValueError, TypeError, OSError):
              print("::error::REVIEWER_PERMISSIONS_UNVERIFIED: authenticated permission lookup failed", file=sys.stderr)
              sys.exit(2)
          result={
              "schema": 1, "repo": "frenndak/SmartSVG-Studio",
              "main_sha": os.environ["MAIN_SHA"],
              "checked_main_sha": os.environ["CHECKED_MAIN"],
              "checked_head_sha": os.environ["CHECKED_HEAD"],
              "checked_base_ref": os.environ["CHECKED_BASE_REF"],
              "checked_base_sha": os.environ["CHECKED_BASE_SHA"],
              "pr": read("pr.json"),
              "comparison": read("compare.json"),
              "changed_files": read("files.json"),
              "workflow_runs": read("runs.json").get("workflow_runs", []),
              "workflow_provenance": {
                  row["name"]: {k: v for k, v in row.items() if k != "name"}
                  for row in (json.loads(line) for line in
                              (root / "workflow_provenance.jsonl").read_text().splitlines())
              },
              "reviews": read("reviews.json"),
              "trusted_reviewers": trusted_reviewers,
              "audit_comments": read("audit.json"),
          }
          (root / "integration_snapshot.json").write_text(json.dumps(result), encoding="utf-8")
          PY
      - name: Evaluate eligibility without mutations
        shell: bash
        run: |
          python tools/integration_eligibility.py "$RUNNER_TEMP/integration_snapshot.json"
          echo "Eligibility only: no merge, no draft transition, no branch update."
