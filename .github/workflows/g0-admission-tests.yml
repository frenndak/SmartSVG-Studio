name: SmartSVG G0 - Admission Tests

on:
  pull_request:
    paths:
      - "tools/validate_release_archive.py"
      - "tools/import_release_archive.py"
      - "tools/verify_v21152_manifest.py"
      - "tests/test_release_archive_gate.py"
      - "tests/test_release_import.py"
      - "tests/test_v21152_manifest.py"
      - "tests/test_svg_contracts.py"
      - "tests/test_synthetic_pngs.py"
      - "tests/test_private_workflow_routing.py"
      - ".github/workflows/private-ai-development.yml"
      - "tools/make_synthetic_pngs.py"
      - "tools/inspect_svg_contracts.py"
      - "examples/synthetic/**"
      - "source-releases/**"
      - "engine/**"
      - "tools/verify_source_integrity.py"
      - ".github/workflows/g0-admission-tests.yml"
  push:
    branches: [main]
    paths:
      - "source-releases/**"
      - "engine/**"
      - "tools/verify_source_integrity.py"
      - "tools/validate_release_archive.py"
      - "tools/import_release_archive.py"
      - "tests/test_release_archive_gate.py"
      - "tests/test_release_import.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and test admission gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify immutable V21.15.2 source archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source-releases/ComfyUI_SmartSVG_Studio_V21_15_2_Installation.zip ]]; then
            # The admission report already verified engine/ against the ZIP.
            # Future engine/ edits must be tested, not rejected as deviations
            # from the original V21.15.2 release.
            python tools/verify_source_integrity.py --repo . --archive-only
          else
            if [[ -e .automation/READY ]]; then
              echo "::error::Admitted source archive disappeared"
              exit 1
            fi
            echo "Pre-admission ref: archive absent."
          fi
      - name: Check previously approved admission marker
        shell: bash
        run: |
          set -euo pipefail
          # The admitted source and marker are already on main. CI must not
          # treat their mere presence as an unauthorized *new* creation.
          if [[ -e .automation/READY ]]; then
            test -s .automation/READY
            test -f engine/INSTALLATION_MANIFEST_V21_15_2.json
            test -f source-releases/ComfyUI_SmartSVG_Studio_V21_15_2_Installation.zip
            test -f docs/IMPORT_V21_15_2.json
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/IMPORT_V21_15_2.json").read_text())
          assert data.get("archive_sha256") == "9369656f0216cebb6dccce0d0155bffa16d8c384da6a984bf848cdd8aa003c54"
          assert data.get("internal_manifest_hashes_verified") is True
          assert data.get("verified_manifest_files") == 651
          PY
          else
            echo "Pre-admission branch: marker absent (expected)."
          fi
