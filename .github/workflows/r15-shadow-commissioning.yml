name: SmartSVG R15 - Live shadow commissioning

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  live-shadow:
    if: ${{ github.repository == 'frenndak/SmartSVG-Studio' && github.event.pull_request.number == 196 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'owner/r15-controller-shadow-20261125' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run read-only live commissioning against actual queue
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SMARTSVG_GITHUB_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m tools.smartsvg_controller_commission
